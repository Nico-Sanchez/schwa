<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Los 44 sonidos del inglés británico, explicados para hispanohablantes.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#F1F3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1117" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schwa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body><title>Schwa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Onest:wght@400..700&display=swap">
<style>
/* Layout: app shell with a sticky bar of tabs; "Tabla" pairs the phoneme chart with a sticky sheet, one column under 980px */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --sunken:#E6E9EF; --ink:#141922; --muted:#586174; --line:#D5DAE3;
  --focus:#2F55D4;
  --vow:#BC3352; --vow-soft:#FBE6EB; --vow-line:#EFBCC8;
  --dip:#A35F00; --dip-soft:#FCEED6; --dip-line:#EBCB93;
  --con:#176A8A; --con-soft:#DCEFF6; --con-line:#A6D3E3;
  --good:#1B7A4C; --good-soft:#DDF2E6; --bad:#BD3A2C; --bad-soft:#FBE4E0;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Onest",-apple-system,"Segoe UI",system-ui,sans-serif;
  --f-ipa:"Gentium Book Plus","Charis SIL","Doulos SIL","Noto Serif","Times New Roman",serif;
  --topbar-h:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1117; --surface:#161A22; --sunken:#1F242E; --ink:#E8EBF1; --muted:#98A1B3; --line:#2B313D;
  --focus:#86A2FF;
  --vow:#FF8099; --vow-soft:#36191F; --vow-line:#6A2D3B;
  --dip:#F2B04F; --dip-soft:#33250F; --dip-line:#6B4B19;
  --con:#63C6E3; --con-soft:#112D38; --con-line:#22586A;
  --good:#52CB8D; --good-soft:#12301F; --bad:#FF7F70; --bad-soft:#3B1915;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1117; --surface:#161A22; --sunken:#1F242E; --ink:#E8EBF1; --muted:#98A1B3; --line:#2B313D;
  --focus:#86A2FF;
  --vow:#FF8099; --vow-soft:#36191F; --vow-line:#6A2D3B;
  --dip:#F2B04F; --dip-soft:#33250F; --dip-line:#6B4B19;
  --con:#63C6E3; --con-soft:#112D38; --con-line:#22586A;
  --good:#52CB8D; --good-soft:#12301F; --bad:#FF7F70; --bad-soft:#3B1915;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:inherit;text-decoration-color:var(--line);text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
.ipa{font-family:var(--f-ipa);font-feature-settings:"kern"}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font:800 23px/1 var(--f-display);letter-spacing:-.02em}
.brand .ipa{font-size:15px;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{appearance:none;background:none;border:0;border-radius:999px;padding:7px 14px;font-weight:550;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--sunken)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.voice{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.voice label{font-size:12px;color:var(--muted)}
.voice select{max-width:190px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px}
.toggle{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:550;display:inline-flex;align-items:center;gap:6px}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:760px){
  .tabs{order:3;width:100%}
  .voice select{max-width:150px}
  .voice label{display:none}
}
@media (max-width:480px){
  .brand .ipa{display:none}
  .bar{column-gap:12px}
  .voice select{max-width:118px}
}

main{padding-block:26px 64px}
.panel[hidden]{display:none}
.h1{font:750 clamp(26px,4vw,36px)/1.1 var(--f-display);letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}
.lede{margin:0 0 18px;color:var(--muted);max-width:62ch}
.h3{font:700 13px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.h3 span{font-weight:450;text-transform:none;letter-spacing:0}

.notice{display:flex;gap:10px;align-items:flex-start;background:var(--dip-soft);border:1px solid var(--dip-line);border-radius:12px;padding:10px 14px;margin:0 0 18px;font-size:14px}

.tabla{display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:30px;align-items:start}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin:0 0 20px}
.seg{display:inline-flex;background:var(--sunken);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{appearance:none;border:0;background:none;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:550;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px;border:1px solid}
.lg-v{background:var(--vow-soft);border-color:var(--vow-line)!important}
.lg-d{background:var(--dip-soft);border-color:var(--dip-line)!important}
.lg-cs{background:var(--surface);border-color:var(--con-line)!important}
.lg-cv{background:var(--con-soft);border-color:var(--con-line)!important}
.lg-h{background:var(--bad);border-color:var(--bad)!important;border-radius:50%!important;width:7px!important;height:7px!important;vertical-align:1px!important}

.chart{display:grid;grid-template-columns:4fr 3fr;gap:24px 26px}
.block{min-width:0}
.cons-block{grid-column:1/-1}
.grid{display:grid;gap:8px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g8{grid-template-columns:repeat(8,minmax(0,1fr))}
.axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin:-4px 0 6px}
.tile{appearance:none;position:relative;border:1px solid var(--tline);background:var(--tbg);border-radius:12px;padding:10px 4px 8px;min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:transform .12s ease,box-shadow .12s ease,opacity .2s ease}
.tile .sym{font-family:var(--f-ipa);font-size:31px;line-height:1;color:var(--tc)}
.tile .kw{font-size:12px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-inline:2px}
.tile:hover{transform:translateY(-2px);box-shadow:0 3px 0 var(--tline)}
.tile[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.tile.dim{opacity:.26}
.tile .hard{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.tile.playing .sym{animation:pop .45s ease}
.spacer{visibility:hidden}
@keyframes pop{40%{transform:scale(1.2)}}
[data-kind="short"],[data-kind="long"]{--tbg:var(--vow-soft);--tline:var(--vow-line);--tc:var(--vow)}
[data-kind="diph"]{--tbg:var(--dip-soft);--tline:var(--dip-line);--tc:var(--dip)}
[data-kind="cons"]{--tbg:var(--surface);--tline:var(--con-line);--tc:var(--con)}
[data-kind="cons"][data-voiced="true"]{--tbg:var(--con-soft)}

.ficha{scroll-margin-top:calc(var(--topbar-h) + 12px);position:sticky;top:calc(var(--topbar-h) + 16px + env(safe-area-inset-top,0px));max-height:calc(100vh - var(--topbar-h) - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;scrollbar-width:thin}
.f-head{display:flex;gap:16px;align-items:center}
.f-sym{font-family:var(--f-ipa);font-size:58px;line-height:1;color:var(--tc);min-width:76px;text-align:center;background:var(--tbg);border:1px solid var(--tline);border-radius:16px;padding:12px 10px 14px}
.f-kind{font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.08em;color:var(--tc)}
.f-kw{font:700 22px/1.2 var(--f-display);margin:3px 0 2px}
.f-kw .ipa{font:400 17px var(--f-ipa);color:var(--muted);margin-left:6px}
.f-tech{font-size:13px;color:var(--muted);font-style:italic}
.f-play{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn svg{width:13px;height:13px;flex:none}
.btn[disabled]{opacity:.45;cursor:default}
.f-sec{border-top:1px solid var(--line);padding-top:13px;margin-top:14px}
.f-sec h4{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 5px}
.f-sec p{margin:0}
.diff{display:flex;align-items:center;gap:10px;font-size:13.5px;margin-top:12px}
.diff .bars{display:inline-flex;gap:3px}
.diff .bars i{width:16px;height:6px;border-radius:3px;background:var(--sunken)}
.diff[data-d="0"] .bars i:nth-child(-n+1){background:var(--good)}
.diff[data-d="1"] .bars i:nth-child(-n+2){background:var(--dip)}
.diff[data-d="2"] .bars i{background:var(--bad)}
.exs{display:flex;flex-wrap:wrap;gap:6px}
.ex{appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:5px 10px;display:inline-flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left}
.ex:hover{border-color:var(--muted)}
.ex .w{font-weight:600;font-size:14px}
.ex .ipa{font-size:14px;color:var(--muted)}
.ex .ipa b,.ipa b.t{color:var(--tc);font-weight:700}
.sps{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:14px}
.sps span b{font-weight:700;color:var(--tc)}
.pairbox{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pairbox .vs{color:var(--muted);font-size:13px}
.linkbtn{appearance:none;border:0;background:none;padding:0;color:var(--focus);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.vmap{width:100%;height:auto;display:block;margin-top:4px}
.vmap .tz{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.vmap .grid-l{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.vmap .ax{font:500 10.5px var(--f-body);fill:var(--muted)}
.vmap .en circle{fill:var(--vow);opacity:.5;cursor:pointer}
.vmap .en text{font:400 14px var(--f-ipa);fill:var(--vow);cursor:pointer}
.vmap .en.on circle{opacity:1}
.vmap .en.on text{font-weight:700;font-size:17px}
.vmap .es rect{fill:var(--surface);stroke:var(--muted);stroke-width:1.2}
.vmap .es text{font:600 11px var(--f-body);fill:var(--muted)}
.vmap .arrow{stroke:var(--dip);stroke-width:2.5;fill:none}
.vmap .ah{fill:var(--dip)}
.vmap .start{fill:var(--dip)}
.vlegend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px;flex-wrap:wrap}

.minibar{position:fixed;left:0;right:0;bottom:0;z-index:7;display:none;align-items:center;gap:12px;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -6px 20px rgb(0 0 0 / .08)}
.minibar .sym{font:400 26px/1 var(--f-ipa);color:var(--tc)}
.minibar .txt{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.minibar .x{appearance:none;border:0;background:none;font-size:22px;line-height:1;color:var(--muted);padding:4px 6px}

@media (max-width:980px){
  .tabla{grid-template-columns:minmax(0,1fr)}
  .ficha{position:static;max-height:none}
  .minibar.show{display:flex}
}
@media (max-width:640px){
  .chart{grid-template-columns:minmax(0,1fr)}
  .g3{grid-template-columns:repeat(4,minmax(0,1fr))}
  .g3 .spacer{display:none}
  .g8{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tile{min-height:78px}
  .tile .sym{font-size:28px}
  .axis{display:none}
  .f-sym{font-size:48px;min-width:64px}
}

.rec .seg{margin-bottom:8px}
.rec-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.rec-msg{font-size:13px;color:var(--muted);margin:6px 0 0}
.rec-msg:empty{display:none}
.recdot{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none}
.btn.recording{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.btn.recording .recdot{background:var(--bg);border-radius:2px}
.btn.nudge{border-color:var(--ink);box-shadow:0 0 0 3px var(--sunken)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%)}
.specs{display:grid;gap:8px;margin-top:12px}
.spec{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.spec canvas{display:block;width:100%;height:96px}
.spec span{position:absolute;top:6px;font-size:10.5px;font-weight:650;letter-spacing:.06em;color:var(--muted);background:var(--surface);padding:1px 6px;border-radius:4px}
.spec .who{left:8px;text-transform:uppercase}
.spec .khz{right:8px}
.level{position:relative;height:22px;margin-top:10px;border-radius:6px;background:var(--sunken);overflow:hidden}
.level i{position:absolute;inset:0 auto 0 0;width:0;background:var(--good)}
.level[data-st="low"] i{background:var(--dip)}
.level[data-st="hot"] i{background:var(--bad)}
.level span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:600}
.verdict{margin-top:12px;border-radius:12px;padding:10px 14px;border:1px solid var(--line);background:var(--bg)}
.verdict b{display:block;font:700 15px var(--f-display)}
.verdict p{margin:2px 0 0;font-size:14px}
.verdict small{display:block;margin-top:4px;font-size:12px;color:var(--muted)}
.verdict[data-level="good"]{border-color:var(--good);background:var(--good-soft)}
.verdict[data-level="close"]{border-color:var(--dip);background:var(--dip-soft)}
.verdict[data-level="try"]{border-color:var(--bad);background:var(--bad-soft)}
.cal-big{font-size:42px!important;line-height:1.1}
.rec-more{margin-top:12px;font-size:13px}
.rec-more summary{cursor:pointer;color:var(--muted);font-weight:600}
.vmap .me circle{fill:var(--ink)}
.vmap .me text{font-size:11px;font-weight:700;fill:var(--ink)}

/* Transcribir */
.tx{max-width:900px}
.tx label{display:block;font-weight:600;margin-bottom:6px}
.tx textarea{width:100%;resize:vertical;min-height:64px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.45}
.tx-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0 18px}
.tx-line{font:400 21px/1.5 var(--f-ipa);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 16px;overflow-wrap:anywhere}
.words{display:flex;flex-wrap:wrap;gap:10px}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;max-width:100%}
.wcard .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wcard .w{font-weight:650;font-size:15px}
.wcard .tr{font:400 19px/1.2 var(--f-ipa)}
.wcard .alt{font-size:12.5px;color:var(--muted)}
.wcard .alt .ipa{font-size:14px}
.wcard.unk .tr{font:italic 14px var(--f-body);color:var(--muted)}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;width:30px;height:30px;display:inline-grid;place-items:center;flex:none}
.iconbtn svg{width:12px;height:12px}
.iconbtn:hover{border-color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.ph{appearance:none;position:relative;font:400 18px/1 var(--f-ipa);min-width:34px;height:34px;padding:0 6px;border-radius:8px;background:var(--tbg);color:var(--tc);border:1px solid var(--tline)}
.ph:hover{transform:translateY(-1px)}
.ph[data-st="1"]{font-weight:700;box-shadow:inset 0 -3px 0 var(--tc)}
.infobar{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:14px;align-items:center}
.infobar .sym{font:400 34px/1 var(--f-ipa);color:var(--tc);min-width:52px;text-align:center}
.infobar .body{flex:1;min-width:0;font-size:14px}
.infobar .body b{font-size:15px}
.note{font-size:13.5px;color:var(--muted);max-width:70ch;margin-top:18px}

/* Practicar */
.prac{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.setchip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;display:inline-flex;gap:6px;align-items:baseline}
.setchip .ipa{font-size:15px}
.setchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.setchip .star{font-size:10px;color:var(--bad)}
.setchip[aria-pressed="true"] .star{color:inherit}
.game{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.dots{display:flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--sunken)}
.dots i.ok{background:var(--good)}
.dots i.ko{background:var(--bad)}
.dots i.now{background:var(--ink)}
.gmain{display:flex;align-items:center;gap:16px;margin:20px 0}
.bigplay{appearance:none;width:68px;height:68px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.bigplay svg{width:22px;height:22px;margin-left:3px}
.bigplay:hover{opacity:.9}
.gprompt{font-size:15px}
.gprompt .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.answers.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.ans{appearance:none;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.ans:hover:not([disabled]){border-color:var(--ink)}
.ans .w{font:700 22px/1.1 var(--f-display)}
.ans .ipa{font-size:18px;color:var(--muted)}
.ans.big .ipa{font-size:23px;color:var(--ink)}
.ans[disabled]{cursor:default}
.ans.right{border-color:var(--good);background:var(--good-soft)}
.ans.wrong{border-color:var(--bad);background:var(--bad-soft)}
.feedback{min-height:24px;margin-top:14px;font-size:14.5px}
.feedback .ok{color:var(--good);font-weight:700}
.feedback .ko{color:var(--bad);font-weight:700}
.feedback .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.gfoot{display:flex;justify-content:flex-end;margin-top:16px}
#mode{border-radius:18px}
.answers.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.sylls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ans.syl{flex:1 1 72px;max-width:140px}
.sentence{font:600 20px/1.35 var(--f-display);margin-bottom:6px}
.blank{display:inline-block;width:64px;border-bottom:2px solid var(--ink);margin:0 4px}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:14px}
.slot{min-width:38px;height:42px;display:grid;place-items:center;border-bottom:2px solid var(--line);font:400 22px/1 var(--f-ipa)}
.slot.on{border-color:var(--ink)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.bank .ph{min-width:44px;height:44px;font-size:20px}
.bank .ph[disabled]{opacity:.45}
.word-big{font:750 34px/1.1 var(--f-display);letter-spacing:-.01em}
.stats{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.stats h3{font:700 15px var(--f-display);margin:0 0 4px}
.stat{display:grid;grid-template-columns:72px minmax(0,1fr) 46px;align-items:center;gap:8px;font-size:13px;margin-top:8px}
.stat .ipa{font-size:15px}
.stat .meter{height:7px;border-radius:4px;background:var(--sunken);overflow:hidden}
.stat .meter i{display:block;height:100%;background:var(--good)}
.stat .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.end{text-align:center;padding:10px 0}
.end .score{font:800 46px/1 var(--f-display)}
@media (max-width:900px){.prac{grid-template-columns:minmax(0,1fr)}}
@media (max-width:480px){.ans .w{font-size:19px}.ans.big .ipa{font-size:19px}.word-big{font-size:28px}}

/* Ruta */
.ruta{max-width:880px}
.lvl{display:grid;grid-template-columns:56px minmax(0,1fr);gap:4px 16px;padding:22px 0;border-top:1px solid var(--line)}
.lvl .num{font:800 40px/1 var(--f-display);color:var(--sunken);-webkit-text-stroke:1px var(--muted)}
.lvl h2{font:700 21px/1.2 var(--f-display);margin:2px 0 4px}
.lvl > div > p{margin:0 0 12px;color:var(--muted)}
.res{display:grid;gap:10px}
.r{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.r .name{font-weight:650}
.r .name a{text-decoration:none}
.r .name a:hover{text-decoration:underline}
.tags{display:inline-flex;gap:5px;margin-left:8px;vertical-align:1px}
.tag{font-size:11px;font-weight:650;border-radius:5px;padding:1px 6px;background:var(--sunken);color:var(--muted)}
.tag.free{background:var(--good-soft);color:var(--good)}
.r .pro,.r .con{font-size:13.5px}
.r .con{color:var(--muted)}
.here{background:var(--ink);color:var(--bg);border-radius:16px;padding:18px 20px;margin:8px 0 26px}
.here h2{font:750 20px var(--f-display);margin:0 0 8px}
.here ul{margin:0;padding-left:18px}
.here li{margin:4px 0}
.plan{counter-reset:s;list-style:none;padding:0;margin:8px 0 0;display:grid;gap:10px}
.plan li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start}
.plan li::before{content:counter(s);font:800 15px/34px var(--f-display);text-align:center;border-radius:50%;background:var(--sunken);height:34px}
.credits{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:30px;padding-top:14px;max-width:80ch}
@media (max-width:520px){.lvl{grid-template-columns:minmax(0,1fr)}.lvl .num{font-size:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.seg.sm button{padding:4px 9px;font-size:12px}
.pick{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.pick select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px;color:var(--ink);max-width:220px}
@media (max-width:480px){.voice select{max-width:104px}.voice{gap:6px}}
</style>

const L1 = {"es": {"name": {"en": "Spanish (Latin America)", "es": "Español (Latinoamérica)"}, "lang": {"en": "Spanish", "es": "español"}, "vowels": true, "prio": ["ii-i", "ae-uh", "o-ou", "oo-ou", "er-oo", "b-v", "s-z", "th-t", "th-s", "dh-d", "sh-ch", "y-dj"], "notes": {"iː": {"diff": 1, "cmp": "Como la i de «sí», pero más larga y tensa.", "err": "Acortarla y confundirla con /ɪ/: «leave» termina sonando como «live»."}, "ɪ": {"diff": 2, "cmp": "No existe en español. Queda entre nuestra i y nuestra e: di «i» aflojando toda la boca.", "err": "Decirla como una i española, y entonces «ship» suena «sheep». Es la confusión más común de los hispanohablantes."}, "ʊ": {"diff": 2, "cmp": "Queda entre la u y la o del español.", "err": "Hacerla igual que /uː/: «full» y «fool» terminan sonando idénticas."}, "uː": {"diff": 1, "cmp": "Como la u de «luna», pero más larga.", "err": "Acortarla. Y ojo: muchas palabras escritas con u llevan /j/ delante: «music» es /ˈmjuːzɪk/."}, "e": {"diff": 0, "cmp": "Prácticamente la e del español.", "err": "Casi ninguno. El riesgo es confundirla con /æ/ («bed» y «bad») o con /eɪ/ («let» y «late»)."}, "ə": {"diff": 2, "cmp": "No existe en español. Es el sonido que haces cuando dudas («eh…»), pero más corto y neutro.", "err": "Pronunciar cada vocal como se escribe: «banana» con tres a españolas. Es la marca número uno del acento hispano."}, "ɜː": {"diff": 2, "cmp": "No existe en español. Se parece a la «eu» del francés, pero sin redondear los labios.", "err": "Decir una e o una o más una r fuerte. Y confundir «work» con «walk», que lleva /ɔː/."}, "ɔː": {"diff": 1, "cmp": "Como una o española, más larga y con los labios más redondos.", "err": "Acortarla o convertirla en /əʊ/: «walk» y «woke», «caught» y «coat» son palabras distintas."}, "æ": {"diff": 2, "cmp": "No existe en español. Queda entre nuestra a y nuestra e.", "err": "Decir una a española, que al oído inglés suena a /ʌ/: «cat» se confunde con «cut» y «bag» con «bug»."}, "ʌ": {"diff": 1, "cmp": "Es lo más parecido a nuestra a, pero más corta y algo más cerrada.", "err": "Leerla según la letra: «love» con o, «country» con ou. Muchas veces se escribe con o y suena casi como una a."}, "ɑː": {"diff": 1, "cmp": "Una a española más larga y más de garganta.", "err": "Hacerla corta. En británico tampoco suena la r de «car»."}, "ɒ": {"diff": 1, "cmp": "Entre la a y la o del español: abre la boca como para una a y redondea un poco los labios.", "err": "Decir una o española cerrada, y «not» suena casi como «note»."}, "ɪə": {"diff": 1, "cmp": "Como «ía», pero con la segunda parte floja, sin llegar a la a.", "err": "Pronunciar la r escrita: en británico «here» no la tiene, salvo que siga una vocal."}, "eɪ": {"diff": 0, "cmp": "Como «ei» en «rey» o «seis».", "err": "Hacer solo una e: «late» suena «let» y «wait» suena «wet»."}, "ʊə": {"diff": 0, "cmp": "Como una «úa» floja.", "err": "Ninguno grave: es raro y muchos británicos ya no lo usan."}, "ɔɪ": {"diff": 0, "cmp": "Como «oy» en «hoy».", "err": "Casi ninguno: es de los más fáciles."}, "əʊ": {"diff": 2, "cmp": "No es una o española: empieza con la «e» de duda y cierra hacia u, como «eu».", "err": "Decir una o pura, y «phone» suena «fon». También confundir «woke» con «walk»."}, "eə": {"diff": 1, "cmp": "Como una e larga y abierta.", "err": "Agregar una r fuerte al final."}, "aɪ": {"diff": 0, "cmp": "Como «ai» en «baile» o «hay».", "err": "Leer la i como i española, y «time» suena «tim»."}, "aʊ": {"diff": 0, "cmp": "Como «au» en «auto» o «causa».", "err": "Pronunciar «ow» siempre igual: «now» es /aʊ/ pero «know» es /əʊ/."}, "p": {"diff": 1, "cmp": "Como la p española, más un soplido al principio de palabra.", "err": "Sin soplido, a un nativo «pin» le puede sonar a «bin». Prueba con un papel delante de la boca: se tiene que mover."}, "b": {"diff": 1, "cmp": "Como la b de «bomba». En español, entre vocales la b se afloja («cabo»); en inglés nunca.", "err": "Mezclar b y v. En español son el mismo sonido; en inglés, «berry» y «very» son palabras distintas."}, "t": {"diff": 1, "cmp": "Parecida a la t española, pero más atrás: tocas la encía, no los dientes.", "err": "Hacerla dental como en español, sin soplido."}, "d": {"diff": 1, "cmp": "Como la d de «dedo» al principio. En español se afloja entre vocales («nada»); en inglés siempre es un golpe firme.", "err": "Aflojarla, y «ladder» suena con /ð/. O no pronunciarla al final: «red» termina sonando «re»."}, "tʃ": {"diff": 0, "cmp": "Igual que la ch de «chico».", "err": "Usarla donde va /ʃ/: «ship» suena «chip» y «shoes» suena «choose»."}, "dʒ": {"diff": 1, "cmp": "Como la y enfática de «¡yo!» en muchos países: una «ch» con vibración.", "err": "Confundirla con /j/: «Yale» y «jail», «yet» y «jet» terminan sonando igual."}, "k": {"diff": 0, "cmp": "Como la c de «casa», con soplido.", "err": "Casi ninguno. El soplido ayuda a que «cold» no suene «gold»."}, "g": {"diff": 0, "cmp": "Como la g de «gato». No la aflojes entre vocales, como pasa en «agua».", "err": "Agregarla donde no va: en «singer» no hay /g/."}, "f": {"diff": 0, "cmp": "Igual que la f española.", "err": "Ninguno. Recuerda que «ph» y a veces «gh» suenan /f/."}, "v": {"diff": 2, "cmp": "No existe en español: nuestra v suena igual que la b.", "err": "Decir b: «very» suena «berry» y «vote» suena «boat». Apoya los dientes en el labio y zumba."}, "θ": {"diff": 2, "cmp": "Es la z o la c de España («zapato», «cielo»). En Latinoamérica no se usa.", "err": "Cambiarla por t, s o f: «think» suena «tink» o «sink», y «three» suena «tree»."}, "ð": {"diff": 2, "cmp": "Es la d suave de «nada» o «cada» cuando la dices relajada. ¡Ya la tienes!", "err": "Decir una d fuerte: «they» suena «day» y «then» suena «den». Está en las palabras más usadas: the, this, that, they."}, "s": {"diff": 1, "cmp": "Igual que nuestra s, pero en inglés se pronuncia siempre completa, también al final.", "err": "Poner una e delante: «school» → «eschool», «Spain» → «Espain»."}, "z": {"diff": 2, "cmp": "No existe como s     after: (it, ok) => `<span class="${ok ? "ok" : "ko"}">${esc(t(ok ? "good" : "almost"))}</span> ${esc(t("schwa_was", { s: it.right.map(k => it.syl[k]).join(", ") }))}<div class="row">${exHTML(it.w, "ə")}</div>` },
  weak: { gate: true, ask: () => t(game.played ? "weak_q" : "weak_play"), tag: () => "", why: () => "", prompt: it => `<div class="sentence" lang="en">${blank(it.s.t)}</div>`, main: it => `<div class="answers three">${it.list.map((w, k) => ansHTML(k, `<span class="w">${esc(w)}</span>`)).join("")}</div>`,
    right: it => [it.list.indexOf(it.s.w)], play: (it, slow) => playClip(`audio/s/${it.s.id}.mp3`, it.s.t.replace("___", it.s.w), slow),
    after: (it, ok) => `<span class="${ok ? "ok" : "ko"}">${esc(t(ok ? "good" : "almost"))}</span> ${esc(t("weak_was", { w: it.s.w, weak: it.s.weak, strong: it.s.strong }))}` },
  read: { ask: () => t("which_tr"), tag: () => "", why: () => "", prompt: it => `<div class="word-big">${esc(shown(it.w))}</div>`, main: it => `<div class="answers four">${it.list.map((o, k) => ansHTML(k, `<span class="ipa">/${esc(o.s)}/</span>`, "big")).join("")}</div>`,
    right: it => [it.list.findIndex(o => o.ok)], play: (it, slow) => sayWord(it.w, slow),
    after: (it, ok) => { if (ok) return `<span class="ok">${esc(t("good"))}</span>`; const o = it.list[game.pick], sym = id => { const p = phon(id); return `<span class="ipa">/${esc(id)}/</span>${p ? ` (${p.emoji} ${esc(p.kw)})` : ""}`; }; return `<span class="ko">${esc(t("wrong_tr", { to: "\u0001", from: "\u0002" }))}</span>`.replace("\u0001", sym(o.to)).replace("\u0002", sym(o.from)); } }
};
function renderSets() {
  const box = $("#sets"), on = CONTRAST_MODES.has(game.mode);
  box.hidden = !on;
  if (!on) return;
  const pr = prof()?.prio || [];
  const chip = (id, label, extra = "") => `<button class="setchip" data-set="${id}" aria-pressed="${game.set === id}">${label}${extra}</button>`;
  box.innerHTML = chip("mix", esc(prof() ? t("mix_l1", { lang: profLang() }) : t("mix_all")))
    + PAIRS.map(s => chip(s.id, `<span class="ipa">${pairLabel(s)}</span>`, pr.includes(s.id) ? `<span class="star" title="${esc(t("prio_title"))}">●</span>` : "")).join("");
}
$("#sets").addEventListener("click", e => {
  const b = e.target.closest("[data-set]"); if (!b) return;
  game.set = b.dataset.set; store.set("set", game.set); newGame();
});
function newGame() {
  if (game.set !== "mix" && !setById(game.set)) game.set = "mix";
  const items = game.mode === "today" ? DAILY_PLAN.flatMap(([ty, n]) => MAKE[ty]("mix", mixPool(), n)) : MAKE[game.mode](game.set, contrastPool(), 10);
  Object.assign(game, { items, i: 0, score: 0, res: [], played: false, answered: false, pick: null, typed: [] });
  renderSets(); renderGame();
}
function renderEnd(g) {
  const n = game.items.length, ratio = n ? game.score / n : 0, misses = game.items.filter((it, k) => !game.res[k] && it.pair);
  const log = game.mode === "today" ? dailyStreak(store.get("daily", {}), today()) : null;
  if (log) store.set("daily", log);
  g.innerHTML = `<div class="end"><div class="score">${game.score}/${n}</div><p>${esc(t(ratio >= .9 ? "end_9" : ratio >= .65 ? "end_7" : "end_low"))}</p>
    ${log ? `<p class="muted">${esc(t("today_done", { n: log.streak }))}</p>` : ""}
    ${misses.length ? `<div class="exs" style="justify-content:center">${misses.map(m => exHTML(m.pair[0], m.set.a) + exHTML(m.pair[1], m.set.b)).join("")}</div>` : ""}
    <p style="margin-top:16px"><button class="btn primary" id="g-again">${esc(t("again"))}</button></p></div>`;
  $("#g-again").onclick = newGame;
  renderStats();
}
function playItem(it, slow) {
  game.played = true;
  stopAll();
  const q = QT[it.type];
  if (q.gate && !game.answered) { $$("#game .ans, #game .bank .ph").forEach(b => b.disabled = false); $("#g-q").textContent = q.ask(it); }
  return q.play(it, slow);
}
function renderGame() {
  const g = $("#game");
  $("#game-lede").textContent = t("lede_" + game.mode);
  if (game.i >= game.items.length) return renderEnd(g);
  const it = game.items[game.i], q = QT[it.type], n = game.items.length, tag = q.tag(it), why = q.why(it);
  const dots = game.items.map((_, k) => `<i class="${k < game.i ? (game.res[k] ? "ok" : "ko") : k === game.i ? "now" : ""}"></i>`).join("");
  g.innerHTML = `<div class="gtop"><span>${esc(t("round", { i: game.i + 1, n }))}${tag ? ` · <span class="ipa">${tag}</span>` : ""}</span><span class="dots">${dots}</span></div>
    <div class="gmain"><button class="bigplay" id="g-play" aria-label="${esc(t("play_word"))}">${PLAY}</button>
      <div class="gprompt">${q.prompt ? q.prompt(it) : ""}<span id="g-q">${esc(q.ask(it))}</span> <button class="linkbtn" id="g-slow">${esc(t("repeat_slow"))}</button>${why ? `<span class="why">${esc(why)}</span>` : ""}</div></div>
    ${q.main(it)}
    <div class="feedback" id="g-fb"></div>
    <div class="gfoot"><button class="btn primary" id="g-next" ${game.answered ? "" : "hidden"}>${esc(t("next"))}</button></div>`;
  $("#g-play").onclick = () => playItem(it);
  $("#g-slow").onclick = () => playItem(it, true);
  $$("#game .ans").forEach(b => b.onclick = () => { if (!game.answered) settle(it, q.right(it).includes(+b.dataset.k), +b.dataset.k); });
  $$("#game [data-tok]").forEach(b => b.onclick = () => { if (game.typed.length < it.tr.length) { game.typed.push(b.dataset.tok); renderGame(); } });
  const del = $("#dict-del"), chk = $("#dict-check");
  if (del) del.onclick = () => { game.typed.pop(); renderGame(); };
  if (chk) chk.onclick = () => settle(it, lookup(it.w).trs.some(tr => tr.map(x => norm(x.p)).join(" ") === game.typed.map(norm).join(" ")), null);
  $("#g-next").onclick = () => { game.i++; Object.assign(game, { played: false, answered: false, pick: null, typed: [] }); renderGame(); const nx = game.items[game.i]; if (nx && QT[nx.type].gate) playItem(nx); };
  if (game.answered) reveal(it);
}
function reveal(it) {
  const q = QT[it.type], ok = game.res[game.i];
  if (q.right) { const r = q.right(it); $$("#game .ans").forEach(x => { x.disabled = true; const k = +x.dataset.k; if (r.includes(k)) x.classList.add("right"); else if (k === game.pick) x.classList.add("wrong"); }); }
  $("#g-fb").innerHTML = q.after(it, ok);
  $("#g-next").hidden = false;
}
function settle(it, ok, k) {
  game.answered = true; game.pick = k; game.res[game.i] = ok; if (ok) game.score++;
  cards[it.key] = grade(cards[it.key], ok, today()); store.set("cards", cards);
  if (it.set) { const st = stats[it.set.id] || (stats[it.set.id] = { ok: 0, n: 0 }); st.n++; if (ok) st.ok++; store.set("stats", stats); }
  if (it.type === "dict") renderGame(); else reveal(it);
  $("#g-next").focus();
  if (["stress", "schwa", "read"].includes(it.type)) sayWord(it.w);
  renderStats();
}
function renderStats() {
  const rows = PAIRS.filter(s => stats[s.id]?.n).map(s => {
    const { ok, n } = stats[s.id], pct = Math.round(ok / n * 100);
    return `<div class="stat"><span class="ipa">/${esc(s.a)}/–${s.b ? "/" + esc(s.b) + "/" : "h"}</span><span class="meter"><i style="width:${pct}%"></i></span><span class="n">${pct}%</span></div>`;
  });
  const keys = Object.keys(cards), due = dueCount(keys, cards, today()), streak = store.get("daily", {}).streak || 0;
  $("#stats").innerHTML = `<h3>${esc(t("stats_title"))}</h3><p class="muted" style="margin:0;font-size:13px">${esc(t(rows.length ? "stats_has" : "stats_none"))}</p>${rows.join("")}
    ${keys.length ? `<p class="muted" style="margin:12px 0 0;font-size:13px">${esc(t("stats_due", { n: due }))}${streak ? " · " + esc(t("stats_streak", { n: streak })) : ""}</p>` : ""}
    ${rows.length || keys.length ? `<p style="margin:14px 0 0"><button class="linkbtn" id="st-reset">${esc(t("stats_reset"))}</button></p>` : ""}`;
  const r = $("#st-reset");
  if (r) r.onclick = () => { for (const o of [stats, cards, decks]) for (const k in o) delete o[k]; store.set("stats", stats); store.set("cards", cards); store.set("decks", decks); store.set("daily", {}); renderStats(); };
}
function setMode(m) {
  game.mode = m; store.set("mode", m);
  $$("#mode button").forEach(b => b.setAttribute("aria-pressed", b.dataset.m === m));
  newGame();
}
$$("#mode button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.m)));

    <p class="credits">${t("credits")}</p>`;

/* tabs */
const TABS = ["tabla", "transcribir", "practicar", "ruta"];
function go(tab, push = true) {
  if (!TABS.includes(tab)) tab = "tabla";
  TABS.forEach(id => { $("#p-" + id).hidden = id !== tab; $("#t-" + id).setAttribute("aria-selected", id === tab); });
  if (tab !== "tabla") hideMini();
  if (push) { try { history.replaceState(null, "", "#" + tab); } catch {} }
  window.scrollTo({ top: 0 });
}
$$(".tab").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));
const setTopbarH = () => document.documentElement.style.setProperty("--topbar-h", $("#topbar").offsetHeight + "px");
new ResizeObserver(setTopbarH).observe($("#topbar"));

applyI18n();
loadVoices();
renderL1Selects();
renderTiles();
applyFilter();
renderFicha();
renderTx();
renderRuta();
setMode(game.mode);

go((location.hash || "").slice(1) || "tabla", false);
